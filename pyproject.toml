[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autooffice"
version = "1.0.0"
description = "AutoOffice — 自然语言驱动的办公自动化工具集"
requires-python = ">=3.11"

dependencies = [
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.10.0",
    "typer>=0.12.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
]

[project.scripts]
oa = "office_automation.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
